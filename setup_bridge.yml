---
- name: Set up celestia bridge node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [bridge]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml
        - name: Include dependencies setup tasks
          ansible.builtin.include_tasks: tasks/setup_dependencies.yml

  tasks:
    - name: Run bridge role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include bridge role
          ansible.builtin.include_role:
            name: bridge
            public: true

  post_tasks:
    - name: Verify bridge node
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ bridge_log_file_path }}"
            version_command: "{{ bridge_bin_dir }}/{{ service_identifier }} version"
            # release binaries print the tag without the leading v, e.g. "Semantic version: 0.23.5-mocha"
            expected_version: "{{ vars[project][type].version | regex_replace('^v', '') }}"
            health_url: "http://localhost:{{ bridge_rpc_port }}"
            health_method: POST
            health_body: {"jsonrpc": "2.0", "method": "node.Ready", "params": [], "id": 1}
